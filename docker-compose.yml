services:
  db:
    image: postgres:16-alpine
    container_name: vet-sistema-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vet
      POSTGRES_PASSWORD: vet
      POSTGRES_DB: vet_sistema
    ports:
      - "5432:5432"
    volumes:
      - vet_sistema_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vet -d vet_sistema"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vet_sistema_pgdata:
